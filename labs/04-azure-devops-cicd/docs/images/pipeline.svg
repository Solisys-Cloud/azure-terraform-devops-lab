<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Lab 04 - Terraform CI/CD with Azure Pipelines</title>
<desc id="desc">Code on GitHub triggers an Azure Pipelines run. The Plan stage checks formatting, validates and plans. On main, the run waits for a human approval, then the Apply stage applies the saved plan to Azure. Authentication uses workload identity federation and the Terraform state is stored in Azure Storage.</desc>
