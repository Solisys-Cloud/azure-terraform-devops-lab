  <text x="600" y="561" text-anchor="middle" fill="#61758b" font-family="Arial, Helvetica, sans-serif" font-size="17">Dashed lines = subnet-to-NSG associations · No virtual machines or custom NSG rules</text>
  <text x="600" y="586" text-anchor="middle" fill="#7b8795" font-family="Arial, Helvetica, sans-serif" font-size="14">Educational example — not a production-ready security architecture</text>
